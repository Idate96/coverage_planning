[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-planning"
version = "0.1.0"
description = "Cellular decomposition coverage planning experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
opt = [
    "gurobipy>=11",
]

[project.scripts]
coverage-planning-examples = "cpp.examples:main"

[tool.setuptools.packages.find]
include = ["cpp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore:.*The binary mode of fromstring is deprecated.*:DeprecationWarning",
]
